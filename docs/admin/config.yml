# Decap CMS の設定。編集画面は公開サイトの /admin/ で開く。
backend:
  name: github
  repo: oyasaiserver/wiki
  branch: main
  auth_scope: repo # 非公開リポジトリのため
  # base_url: GitHub ログインの中継（OAuth）の URL。置き場所が決まったら設定する。
  commit_messages:
    create: "docs: {{collection}} に「{{slug}}」を追加"
    update: "docs: {{collection}} の「{{slug}}」を更新"
    delete: "docs: {{collection}} の「{{slug}}」を削除"
    uploadMedia: "docs: 画像 {{path}} を追加"
    deleteMedia: "docs: 画像 {{path}} を削除"

publish_mode: editorial_workflow # 保存すると PR になる。公開 = merge
locale: ja

media_folder: docs/assets
public_folder: /assets

collections:
  - name: start
    label: "はじめに・接続"
    folder: docs/start
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 本文, name: body, widget: markdown }
  - name: rules
    label: "ルールとマナー"
    folder: docs/rules
